name: CI

# Work happens on dev and lands on main, so main is the only branch worth spending runners on.
# workflow_dispatch stays because it is manual, which is how a run is repeated without a push.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Two axes, crossed only where the code paths actually cross. The library shape is one of those
  # places: it decides dllexport against visibility, and whether a plugin and its host share one
  # type table or get one each, which is different on every platform. So shape runs everywhere.
  #
  # Turning exceptions or RTTI off is not: the flag is picked by MSVC against not-MSVC, and the
  # rest of what varies is which standard library is underneath. Three platforms cover both
  # compiler families and all three standard libraries, and are in the no-features job below.
  build:
    name: ${{ matrix.platform }} ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ linux-gcc, linux-clang, macos, windows-msvc, windows-clang-cl ]
        config: [ shared, static, release ]
        include:
          - platform: linux-gcc
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - platform: linux-clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - platform: macos
            os: macos-latest
            cc: clang
            cxx: clang++
          - platform: windows-msvc
            os: windows-latest
            cc: cl
            cxx: cl
          - platform: windows-clang-cl
            os: windows-latest
            cc: clang-cl
            cxx: clang-cl

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Settings for this configuration
        id: cfg
        shell: bash
        run: |
          case "${{ matrix.config }}" in
            shared)  flags="-DSTDC_BUILD_SHARED=ON"; type=Debug   ;;
            static)  flags="-DSTDC_BUILD_STATIC=ON"; type=Debug   ;;
            release) flags="-DSTDC_BUILD_SHARED=ON"; type=Release ;;
          esac
          echo "flags=$flags" >> "$GITHUB_OUTPUT"
          echo "type=$type" >> "$GITHUB_OUTPUT"

      - name: Configure
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -G Ninja -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ steps.cfg.outputs.type }} \
            -DSTDC_BUILD_TESTS=ON \
            ${{ steps.cfg.outputs.flags }}

      - name: Build
        run: cmake --build build

      # Naming the binary rather than trusting that the build step ran it. A test CMakeLists that
      # cannot find Boost used to warn and return, which is a green build with nothing in it.
      - name: Test
        shell: bash
        run: ./build/bin/test_auto

  # Exceptions and RTTI switched off, one at a time rather than together. Off together would
  # still compile both branches, but it would stop covering RTTI off with exceptions left on,
  # which is the shape a downstream of this library actually builds.
  #
  # Three platforms rather than five: the flag is chosen by MSVC against not-MSVC, and these
  # three are the MSVC standard library, libstdc++ and libc++.
  no-features:
    name: ${{ matrix.platform }} ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ linux-gcc, macos, windows-msvc ]
        config: [ no-exceptions, no-rtti ]
        include:
          - platform: linux-gcc
            os: ubuntu-latest
            cxx: g++
          - platform: macos
            os: macos-latest
            cxx: clang++
          - platform: windows-msvc
            os: windows-latest
            cxx: cl
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Configure
        shell: bash
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          case "${{ matrix.config }}" in
            no-exceptions) flags="-DSTDC_ENABLE_EXCEPTIONS=OFF" ;;
            no-rtti)       flags="-DSTDC_ENABLE_RTTI=OFF" ;;
          esac
          cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSTDC_BUILD_TESTS=OFF $flags

      - name: Build
        run: cmake --build build

  # MinGW builds the library but does not run the tests: Boost.Test for MinGW is its own
  # undertaking, and what is worth knowing here is that the Windows sources compile and link
  # against something other than the Microsoft toolchain.
  mingw:
    name: windows-mingw ${{ matrix.config }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [ shared, static ]
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Build
        shell: msys2 {0}
        run: |
          case "${{ matrix.config }}" in
            shared) flags="-DSTDC_BUILD_SHARED=ON" ;;
            static) flags="-DSTDC_BUILD_STATIC=ON" ;;
          esac
          cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSTDC_BUILD_TESTS=OFF $flags
          cmake --build build
