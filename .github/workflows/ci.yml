name: CI

# Work happens on dev and lands on main, so main is the only branch worth spending runners on.
# workflow_dispatch stays because it is manual, which is how a run is repeated without a push.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Every platform against every configuration, rather than the platforms against one and the
  # configurations against one platform. The option handling is where they differ most: exceptions
  # off is /EHs-c- on MSVC and -fno-exceptions elsewhere, and static against shared decides
  # whether a plugin and its host share one type table or get one each. Testing those on Linux
  # alone would have covered neither.
  build:
    name: ${{ matrix.platform }} ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ linux-gcc, linux-clang, macos, windows-msvc, windows-clang-cl ]
        config: [ shared, static, release, no-exceptions, no-rtti ]
        include:
          - platform: linux-gcc
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - platform: linux-clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - platform: macos
            os: macos-latest
            cc: clang
            cxx: clang++
          - platform: windows-msvc
            os: windows-latest
            cc: cl
            cxx: cl
          - platform: windows-clang-cl
            os: windows-latest
            cc: clang-cl
            cxx: clang-cl

    steps:
      - uses: actions/checkout@v4

      - name: Settings for this configuration
        id: cfg
        shell: bash
        run: |
          case "${{ matrix.config }}" in
            shared)        flags="-DSTDC_BUILD_SHARED=ON";                   type=Debug;   tests=yes ;;
            static)        flags="-DSTDC_BUILD_STATIC=ON";                   type=Debug;   tests=yes ;;
            release)       flags="-DSTDC_BUILD_SHARED=ON";                   type=Release; tests=yes ;;
            no-exceptions) flags="-DSTDC_ENABLE_EXCEPTIONS=OFF";             type=Debug;   tests=no  ;;
            no-rtti)       flags="-DSTDC_ENABLE_RTTI=OFF";                   type=Debug;   tests=no  ;;
          esac
          echo "flags=$flags" >> "$GITHUB_OUTPUT"
          echo "type=$type" >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

      - name: Install Ninja and Boost.Test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libboost-test-dev

      - name: Install Ninja and Boost.Test (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja boost

      # The runner has vcpkg but not at a path worth guessing at, so the one it exports is the one
      # to use. Building boost-test from source is the slow step, which is what the cache is for.
      - name: Locate vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "VCPKG_ROOT=$(cygpath -m "$VCPKG_INSTALLATION_ROOT")" >> "$GITHUB_ENV"

      - name: Cache Boost.Test (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}/installed
          key: vcpkg-boost-test-x64-windows-v2

      - name: Install Boost.Test (Windows)
        if: runner.os == 'Windows' && steps.cfg.outputs.tests == 'yes'
        run: vcpkg install boost-test:x64-windows

      # Ninja everywhere, which needs the MSVC environment on Windows since there is no generator
      # to set it up.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64

      - name: Configure
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          extra=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            extra="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          fi
          cmake -G Ninja -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ steps.cfg.outputs.type }} \
            -DSTDC_BUILD_TESTS=${{ steps.cfg.outputs.tests == 'yes' && 'ON' || 'OFF' }} \
            ${{ steps.cfg.outputs.flags }} $extra

      - name: Build
        run: cmake --build build

      # Boost missing makes the test CMakeLists warn and return, which leaves a green build with
      # nothing built at all. Naming the binary is what turns that into a failure.
      - name: Test
        if: steps.cfg.outputs.tests == 'yes'
        shell: bash
        run: ./build/bin/test_auto

  # MinGW builds the library but does not run the tests: Boost.Test for MinGW is its own
  # undertaking, and what is worth knowing here is that the Windows sources compile and link
  # against something other than the Microsoft toolchain.
  mingw:
    name: windows-mingw ${{ matrix.config }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [ shared, static, no-exceptions, no-rtti ]
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Build
        shell: msys2 {0}
        run: |
          case "${{ matrix.config }}" in
            shared)        flags="-DSTDC_BUILD_SHARED=ON" ;;
            static)        flags="-DSTDC_BUILD_STATIC=ON" ;;
            no-exceptions) flags="-DSTDC_ENABLE_EXCEPTIONS=OFF" ;;
            no-rtti)       flags="-DSTDC_ENABLE_RTTI=OFF" ;;
          esac
          cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSTDC_BUILD_TESTS=OFF $flags
          cmake --build build
