name: CI

# Work happens on dev and lands on main, so main is the only branch worth spending runners on.
# workflow_dispatch stays because it is manual, which is how a run is repeated without a push.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Two axes, crossed only where the code paths actually cross. The library shape is one of those
  # places: it decides dllexport against visibility, and whether a plugin and its host share one
  # type table or get one each, which is different on every platform. So shape runs everywhere.
  #
  # Turning exceptions or RTTI off is not: the flag is picked by MSVC against not-MSVC, and the
  # rest of what varies is which standard library is underneath. Three platforms cover both
  # compiler families and all three standard libraries, and are in the no-features job below.
  build:
    name: ${{ matrix.platform }} ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ linux-gcc, linux-clang, macos, windows-msvc, windows-clang-cl ]
        config: [ shared, static, release ]
        include:
          - platform: linux-gcc
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - platform: linux-clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - platform: macos
            os: macos-latest
            cc: clang
            cxx: clang++
          - platform: windows-msvc
            os: windows-latest
            cc: cl
            cxx: cl
          - platform: windows-clang-cl
            os: windows-latest
            cc: clang-cl
            cxx: clang-cl

    steps:
      - uses: actions/checkout@v4

      - name: Settings for this configuration
        id: cfg
        shell: bash
        run: |
          case "${{ matrix.config }}" in
            shared)  flags="-DSTDC_BUILD_SHARED=ON"; type=Debug;   tests=yes ;;
            static)  flags="-DSTDC_BUILD_STATIC=ON"; type=Debug;   tests=yes ;;
            release) flags="-DSTDC_BUILD_SHARED=ON"; type=Release; tests=yes ;;
          esac
          echo "flags=$flags" >> "$GITHUB_OUTPUT"
          echo "type=$type" >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

      - name: Install Ninja and Boost.Test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libboost-test-dev

      - name: Install Ninja and Boost.Test (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja boost

      # Ninja is not on the Windows image, and there are two vcpkgs: the one Visual Studio bundles
      # and the one on PATH. Deriving the root from the executable that will actually run the
      # install is what keeps those from being different directories.
      #
      # It is carried under our own name, not VCPKG_ROOT. vcvars sets VCPKG_ROOT to the copy
      # Visual Studio bundles, so the msvc-dev-cmd step below silently repoints it between the
      # install and the configure: Boost lands in one vcpkg and CMake is aimed at the other.
      - name: Install Ninja and locate vcpkg (Windows)
        id: vcpkg
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install ninja -y --no-progress
          root=$(cygpath -m "$(dirname "$(command -v vcpkg)")")
          echo "vcpkg root: $root"
          echo "STDC_VCPKG_ROOT=$root" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP\\vcpkg-archives" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vcpkg-archives"
          # The port versions come from whichever vcpkg the image shipped, so its commit is what
          # decides whether a cached binary is still the right one.
          echo "rev=$(git -C "$root" rev-parse --short HEAD 2>/dev/null || echo unknown)" \
            >> "$GITHUB_OUTPUT"

      # vcpkg's own binary cache, not a copy of installed/. Caching installed/ caches the *state*
      # that says a package is present, so one incomplete save gets replayed on every later run
      # and vcpkg answers "already installed" for a tree that is not there, which is a green
      # install step followed by a find_package that comes up empty. A binary cache only skips
      # the compile: the install still runs, and still writes the whole tree.
      - name: Cache vcpkg binaries (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: vcpkg-boost-test-x64-windows-${{ steps.vcpkg.outputs.rev }}
          restore-keys: vcpkg-boost-test-x64-windows-

      - name: Install Boost.Test (Windows)
        if: runner.os == 'Windows' && steps.cfg.outputs.tests == 'yes'
        shell: bash
        run: |
          vcpkg install boost-test:x64-windows
          # find_package(Boost CONFIG) turns on exactly one file, which the boost-cmake port
          # brings in as a dependency of boost-test. Saying whether it arrived makes a failure
          # downstream one question rather than two.
          config="$STDC_VCPKG_ROOT/installed/x64-windows/share/boost/BoostConfig.cmake"
          ls -l "$config" || { echo "missing: $config"; ls "$STDC_VCPKG_ROOT/installed" || true; }

      # Ninja everywhere, which needs the MSVC environment on Windows since there is no generator
      # to set it up.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64

      - name: Configure
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          # An array, because the vcpkg root can be inside Program Files and a bare $extra would
          # split at the space.
          extra=()
          if [ "${{ runner.os }}" = "Windows" ]; then
            # The prefix path as well as the toolchain file. The toolchain works out the triplet
            # for itself, and naming the directory outright is one fewer thing to be wrong.
            extra=(-DCMAKE_TOOLCHAIN_FILE="$STDC_VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
                   -DVCPKG_TARGET_TRIPLET=x64-windows
                   -DCMAKE_PREFIX_PATH="$STDC_VCPKG_ROOT/installed/x64-windows")
          fi
          cmake -G Ninja -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ steps.cfg.outputs.type }} \
            -DSTDC_BUILD_TESTS=${{ steps.cfg.outputs.tests == 'yes' && 'ON' || 'OFF' }} \
            ${{ steps.cfg.outputs.flags }} "${extra[@]}"

      - name: Build
        run: cmake --build build

      # Boost missing makes the test CMakeLists warn and return, which leaves a green build with
      # nothing built at all. Naming the binary is what turns that into a failure.
      - name: Test
        if: steps.cfg.outputs.tests == 'yes'
        shell: bash
        run: ./build/bin/test_auto

  # Exceptions and RTTI switched off, one at a time rather than together. Off together would
  # still compile both branches, but it would stop covering RTTI off with exceptions left on,
  # which is the shape a downstream of this library actually builds.
  #
  # Three platforms rather than five: the flag is chosen by MSVC against not-MSVC, and these
  # three are the MSVC standard library, libstdc++ and libc++.
  no-features:
    name: ${{ matrix.platform }} ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ linux-gcc, macos, windows-msvc ]
        config: [ no-exceptions, no-rtti ]
        include:
          - platform: linux-gcc
            os: ubuntu-latest
            cxx: g++
          - platform: macos
            os: macos-latest
            cxx: clang++
          - platform: windows-msvc
            os: windows-latest
            cxx: cl
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y --no-progress

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64

      # No tests, so no Boost and no toolchain file.
      - name: Build
        shell: bash
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          case "${{ matrix.config }}" in
            no-exceptions) flags="-DSTDC_ENABLE_EXCEPTIONS=OFF" ;;
            no-rtti)       flags="-DSTDC_ENABLE_RTTI=OFF" ;;
          esac
          cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSTDC_BUILD_TESTS=OFF $flags
          cmake --build build

  # MinGW builds the library but does not run the tests: Boost.Test for MinGW is its own
  # undertaking, and what is worth knowing here is that the Windows sources compile and link
  # against something other than the Microsoft toolchain.
  mingw:
    name: windows-mingw ${{ matrix.config }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [ shared, static ]
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Build
        shell: msys2 {0}
        run: |
          case "${{ matrix.config }}" in
            shared) flags="-DSTDC_BUILD_SHARED=ON" ;;
            static) flags="-DSTDC_BUILD_STATIC=ON" ;;
          esac
          cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSTDC_BUILD_TESTS=OFF $flags
          cmake --build build
